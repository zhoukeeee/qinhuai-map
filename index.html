<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>南京夫子庙·秦淮河 视听地图</title>
  <style>
    /* ===== 颜色变量 ===== */
    :root {
      --bg: #f5f0e1;
      --bg2: #ffffff;
      --ink: #3e2c1c;
      --muted: #8a7560;
      --rule: #e0d5c0;
      --accent: #c0392b;
      --accent2: #d4a017;
      --shadow: 0 8px 32px rgba(62, 44, 28, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container { max-width: 820px; margin: 0 auto; }

    /* ===== 标题 ===== */
    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 1.7rem; font-weight: 700; }
    header h1 span { color: var(--accent); }
    header p { color: var(--muted); font-size: 0.88rem; margin-top: 6px; }

    /* ===== 地图容器 ===== */
    .map-wrapper {
      position: relative;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: var(--bg2);
      border: 1px solid var(--rule);
    }
    .map-wrapper img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ===== 景点热点标记 ===== */
    .spot {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 2;
    }
    .spot-dot {
      width: 28px; height: 28px;
      background: var(--accent);
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 0.72rem; font-weight: 700;
      position: relative; z-index: 2;
      transition: transform 0.2s, background 0.2s;
    }
    .spot:hover .spot-dot,
    .spot.active .spot-dot {
      background: var(--accent2);
      transform: scale(1.2);
    }
    /* 脉冲动画 */
    .spot-pulse {
      position: absolute; top: 50%; left: 50%;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.4;
      transform: translate(-50%, -50%);
      animation: pulse 2.2s ease-out infinite;
    }
    @keyframes pulse {
      0% { transform: translate(-50%,-50%) scale(1); opacity: 0.4; }
      100% { transform: translate(-50%,-50%) scale(2.8); opacity: 0; }
    }
    .spot-label {
      position: absolute; top: 30px; left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.92);
      color: var(--ink);
      font-size: 0.7rem; font-weight: 600;
      padding: 3px 9px; border-radius: 6px;
      white-space: nowrap;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      pointer-events: none;
    }

    /* ===== 视频弹窗 ===== */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center; justify-content: center;
      padding: 16px;
    }
    .overlay.show { display: flex; }
    .modal {
      background: var(--bg2);
      border-radius: 14px;
      width: 100%; max-width: 640px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      animation: modalIn 0.25s ease;
    }
    @keyframes modalIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 18px;
    }
    .modal-badge {
      background: var(--accent); color: #fff;
      font-size: 0.7rem; font-weight: 700;
      padding: 2px 8px; border-radius: 8px; white-space: nowrap;
    }
    .modal-header h3 { font-size: 1.1rem; font-weight: 700; }
    .modal-header h3 small {
      font-weight: 400; color: var(--muted);
      font-size: 0.78rem; margin-left: 6px;
    }
    .modal-close {
      margin-left: auto;
      background: none; border: none;
      font-size: 1.4rem; color: var(--muted);
      cursor: pointer; width: 34px; height: 34px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; line-height: 1;
      transition: background 0.2s, color 0.2s;
    }
    .modal-close:hover { background: var(--bg); color: var(--ink); }
    .video-wrap {
      position: relative; width: 100%;
      background: #000; aspect-ratio: 16 / 9;
    }
    .video-wrap video { width: 100%; height: 100%; display: block; }
    .modal-desc {
      padding: 12px 18px 16px;
      font-size: 0.86rem; color: var(--muted); line-height: 1.65;
    }

    /* ===== 底部提示 ===== */
    .tip {
      text-align: center; color: var(--muted);
      font-size: 0.8rem; margin-top: 14px; line-height: 1.6;
    }

    /* ===== 响应式 - 手机适配 ===== */
    @media (max-width: 600px) {
      header h1 { font-size: 1.3rem; }
      .spot-dot { width: 24px; height: 24px; font-size: 0.62rem; border-width: 2px; }
      .spot-pulse { width: 24px; height: 24px; }
      .spot-label { font-size: 0.66rem; padding: 2px 7px; top: 28px; }
      .modal-header h3 { font-size: 1rem; }
      .modal-desc { font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>南京夫子庙·<span>秦淮河</span> 视听地图</h1>
      <p>点击地图上的编号标记，观看景点讲解视频</p>
    </header>

    <!-- ===== 地图区域 ===== -->
    <!-- 背景图片使用相对路径 ./assets/map.jpg -->
    <div class="map-wrapper" id="mapWrapper">
      <img src="./assets/map.jpg" alt="夫子庙秦淮河景区地图">
      <!-- 热点标记由 JavaScript 动态生成，插入到这里 -->
    </div>

    <p class="tip">共 9 个景点 · 点击标记观看视频讲解</p>
  </div>

  <!-- ===== 视频弹窗 ===== -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-badge" id="badge">第1站</span>
        <h3 id="title">景点名称<small id="subtitle"></small></h3>
        <button class="modal-close" id="closeBtn">&times;</button>
      </div>
      <div class="video-wrap">
        <video id="video" controls playsinline muted></video>
      </div>
      <div class="modal-desc" id="desc"></div>
    </div>
  </div>

  <script>
    /* ============================================================
     *  景点数据配置
     *  --------------------------------------------------------
     *  增删景点只需修改下方数组：
     *    - 新增：复制一个对象，改 name / x / y / video / desc
     *    - 删除：删掉对应对象即可
     *  字段说明：
     *    name      景点名称
     *    subtitle  副标题
     *    x, y      热点在地图上的位置（百分比，0~100）
     *    video     视频文件路径（相对路径 ./assets/xxx.mp4）
     *    desc      景点简介
     * ============================================================ */
    const spots = [
      {
        name: '三山街站·瞻园',
        subtitle: '金陵第一园',
        x: 12, y: 10,
        video: './assets/spot1.mp4',
        desc: '瞻园是南京现存历史最久的明代古典园林，被誉为"金陵第一园"，园内假山精巧、太湖石玲珑剔透，为江南五大名园之一。'
      },
      {
        name: '大成殿·泮池',
        subtitle: '夫子庙核心',
        x: 50, y: 13,
        video: './assets/spot2.mp4',
        desc: '大成殿是夫子庙的核心建筑，殿内供奉孔子像；殿前泮池呈半圆形，为古代学宫标配，池水引秦淮河而成。'
      },
      {
        name: '夫子庙牌坊',
        subtitle: '天下文枢',
        x: 28, y: 24,
        video: './assets/spot3.mp4',
        desc: '夫子庙牌坊为景区入口标志，"天下文枢"坊额彰显南京作为六朝古都的文化底蕴，是游客打卡的热门地标。'
      },
      {
        name: '江南贡院·科举博物馆',
        subtitle: '科举圣地',
        x: 80, y: 20,
        video: './assets/spot4.mp4',
        desc: '江南贡院是中国古代最大的科举考场，鼎盛时期可容纳两万余名考生，现已辟为中国科举博物馆，展示千年科举文化。'
      },
      {
        name: '秦淮河',
        subtitle: '十里秦淮',
        x: 63, y: 33,
        video: './assets/spot5.mp4',
        desc: '秦淮河是南京的母亲河，"十里秦淮"风光带自古便是金陵繁华之地，画舫灯影、桨声水韵，名扬天下。'
      },
      {
        name: '乌衣巷·王谢故居',
        subtitle: '六朝风华',
        x: 55, y: 47,
        video: './assets/spot6.mp4',
        desc: '乌衣巷是三国时东吴乌衣营驻地，唐代刘禹锡"旧时王谢堂前燕"使之名扬天下，王谢故居再现六朝世家风华。'
      },
      {
        name: '秦淮画舫码头',
        subtitle: '夜游秦淮',
        x: 33, y: 63,
        video: './assets/spot7.mp4',
        desc: '画舫码头是夜游秦淮河的登船点，乘画舫赏两岸灯彩，是体验"桨声灯影里的秦淮河"的经典方式。'
      },
      {
        name: '老门东历史街区',
        subtitle: '金陵烟火',
        x: 75, y: 72,
        video: './assets/spot8.mp4',
        desc: '老门东是南京传统民居聚落，箍桶巷、剪子巷一带保留明清街巷格局，汇集非遗手作与金陵特色小吃。'
      },
      {
        name: '中华门城堡',
        subtitle: '明代瓮城',
        x: 28, y: 86,
        video: './assets/spot9.mp4',
        desc: '中华门是中国现存规模最大的城门，为明代南京城墙十三座城门之首，三道瓮城设计精巧，军事防御体系完整。'
      }
    ];

    /* ============================================================
     *  生成热点标记（无需修改）
     * ============================================================ */
    const mapWrapper = document.getElementById('mapWrapper');

    spots.forEach((spot, index) => {
      const el = document.createElement('div');
      el.className = 'spot';
      el.style.left = spot.x + '%';
      el.style.top  = spot.y + '%';
      el.innerHTML =
        '<div class="spot-pulse"></div>' +
        '<div class="spot-dot">' + (index + 1) + '</div>' +
        '<div class="spot-label">' + spot.name + '</div>';
      el.addEventListener('click', function () { openModal(index); });
      mapWrapper.appendChild(el);
    });

    /* ============================================================
     *  弹窗逻辑（无需修改）
     * ============================================================ */
    const overlay  = document.getElementById('overlay');
    const videoEl  = document.getElementById('video');
    const badgeEl  = document.getElementById('badge');
    const titleEl  = document.getElementById('title');
    const subEl    = document.getElementById('subtitle');
    const descEl   = document.getElementById('desc');

    function openModal(index) {
      var spot = spots[index];
      badgeEl.textContent = '第' + (index + 1) + '站';
      titleEl.childNodes[0].nodeValue = spot.name;
      subEl.textContent  = spot.subtitle ? '· ' + spot.subtitle : '';
      descEl.textContent = spot.desc;

      // 设置视频源（相对路径）
      videoEl.src = spot.video;

      // 默认静音，自动播放（静音状态下浏览器允许自动播放）
      videoEl.muted = true;
      videoEl.play().catch(function () {});

      overlay.classList.add('show');

      // 标记当前选中
      document.querySelectorAll('.spot').forEach(function (s) { s.classList.remove('active'); });
      document.querySelectorAll('.spot')[index].classList.add('active');
    }

    function closeModal() {
      overlay.classList.remove('show');
      videoEl.pause();
      videoEl.removeAttribute('src');
      videoEl.load();
    }

    // 关闭按钮
    document.getElementById('closeBtn').addEventListener('click', closeModal);

    // 点击遮罩关闭
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closeModal();
    });

    // ESC 键关闭
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && overlay.classList.contains('show')) closeModal();
    });
  </script>
</body>
</html>
